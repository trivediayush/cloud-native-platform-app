name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test:
    name: Test application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run application import test
        run: python -c "from app.app import app; print('Application import successful')"

  security:
    name: Security scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate Dockerfile
        id: dockerfile
        shell: bash
        run: |
          echo "Current directory:"
          pwd

          echo ""
          echo "Repository contents:"
          ls -la

          echo ""
          echo "Searching for Dockerfile..."

          DOCKERFILE=$(find . -type f -name "Dockerfile" -print -quit)

          if [ -z "$DOCKERFILE" ]; then
            echo "ERROR: Dockerfile not found"
            exit 1
          fi

          echo "Dockerfile found at: $DOCKERFILE"

          DOCKER_CONTEXT=$(dirname "$DOCKERFILE")

          if [ "$DOCKER_CONTEXT" = "." ]; then
            DOCKER_CONTEXT="."
          fi

          echo "Docker build context: $DOCKER_CONTEXT"

          echo "dockerfile=$DOCKERFILE" >> "$GITHUB_OUTPUT"
          echo "context=$DOCKER_CONTEXT" >> "$GITHUB_OUTPUT"

      - name: Build container image
        run: |
          docker build \
            -t cloud-native-platform-app:ci \
            "${{ steps.dockerfile.outputs.context }}"

      - name: Verify container image
        run: |
          docker images cloud-native-platform-app

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "cloud-native-platform-app:ci"
          severity: "HIGH,CRITICAL"
          exit-code: "1"